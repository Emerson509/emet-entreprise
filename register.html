<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription - Emet Entreprise</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0b1220; color: #fff;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    form { background: #151f35; padding: 28px; border-radius: 12px; width: 90%; max-width: 340px; }
    h1 { font-size: 20px; margin-top: 0; }
    input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
    button { background: #2f7cf6; color: #fff; cursor: pointer; }
    a { color: #7fb2ff; font-size: 14px; display: block; margin-top: 14px; text-align: center; }
    #message { margin-top: 12px; min-height: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <form id="registerForm">
    <h1>Créer un compte</h1>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Mot de passe (6 caractères min.)" required minlength="6">
    <button type="submit">S'inscrire</button>
    <div id="message"></div>
    <a href="login.html">J'ai déjà un compte</a>
  </form>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import { db } from "./db.js";
    import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.style.color = "#ff7b7b";
      message.textContent = "";
      const email = document.getElementById("email").value;
      const mdp = document.getElementById("password").value;
      try {
        // 1. On crée le compte dans Firebase Authentication
        const resultat = await createUserWithEmailAndPassword(auth, email, mdp);

        // 2. On crée sa fiche dans la base de données, NON approuvée par défaut
        await setDoc(doc(db, "users", resultat.user.uid), {
          email: email,
          approved: false,
          createdAt: serverTimestamp()
        });

        // 3. On le déconnecte : il attend ta validation
        await signOut(auth);
        message.style.color = "#7dffb0";
        message.textContent = "Compte créé. Il sera activé après validation.";
        form.reset();
      } catch (erreur) {
        if (erreur.code === "auth/email-already-in-use") {
          message.textContent = "Cet email a déjà un compte.";
        } else if (erreur.code === "auth/weak-password") {
          message.textContent = "Mot de passe trop court (6 caractères min.).";
        } else {
          message.textContent = "Inscription impossible. Réessaie.";
        }
      }
    });
  </script>
</body>
</html>
